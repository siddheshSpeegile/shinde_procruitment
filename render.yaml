# Render Blueprint: free Static Site for the admin panel.
# Render dashboard > New > Blueprint > pick this repo and the "admin-panel" branch.
services:
  - type: web
    runtime: static
    name: shinde-admin-panel
    branch: admin-panel
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # The live Flask backend (same one the mobile app uses). Change here if it moves.
      - key: VITE_API_BASE_URL
        value: https://shinde-procruitment.onrender.com/api
      - key: NODE_VERSION
        value: "20"
    routes:
      # Single-page app: send every path to index.html so refresh and deep links work.
      - type: rewrite
        source: /*
        destination: /index.html
